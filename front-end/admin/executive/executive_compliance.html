<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Compliance — Executive Command Center</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="css/executive.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" style="display:flex;flex-direction:column;overflow:hidden;">
      <header class="top-header">
        <div>
          <div class="page-title">Compliance Intelligence</div>
          <div id="exec-page-subtitle" style="font-size:13px;color:var(--exec-muted);margin-top:4px;">Company-wide compliance posture and violations</div>
        </div>
        <div class="exec-header-actions">
          <div id="executive-branch-switcher"></div>
        </div>
      </header>

      <div class="executive-content">
        <div class="exec-kpi-grid" id="compliance-kpis"></div>

        <div class="exec-toolbar">
          <div class="exec-toolbar-left">
            <div class="exec-search">
              <i class="ri-search-line"></i>
              <input type="text" id="violation-search" placeholder="Search violations, rules, branches..." />
            </div>
            <select id="severity-filter" class="exec-select">
              <option value="">All Severities</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div id="context-banner" style="font-size:13px;color:var(--exec-muted);font-weight:500;"></div>
        </div>

        <div class="exec-two-col">
          <div class="exec-card">
            <div class="exec-card-header">
              <span class="exec-card-title">Open Violations by Branch</span>
            </div>
            <div class="exec-table-wrap">
              <table class="exec-table">
                <thead>
                  <tr>
                    <th>Rule</th>
                    <th>Branch</th>
                    <th>Entity</th>
                    <th>Severity</th>
                    <th>Status</th>
                    <th>Detected</th>
                  </tr>
                </thead>
                <tbody id="violations-table-body"></tbody>
              </table>
            </div>
          </div>

          <div>
            <div class="exec-card" style="margin-bottom:20px;">
              <div class="exec-card-header"><span class="exec-card-title">Branch Health</span></div>
              <div class="exec-mini-chart"><canvas id="branchHealthChart"></canvas></div>
            </div>
            <div class="exec-card">
              <div class="exec-card-header"><span class="exec-card-title">Pending Evidence</span></div>
              <div id="evidence-summary" style="padding:16px 20px;font-size:13px;color:var(--exec-muted);"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/components/executive-branch-switcher.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="js/executive-shell.js"></script>
  <script src="executive_compliance.js"></script>
</body>
</html>
