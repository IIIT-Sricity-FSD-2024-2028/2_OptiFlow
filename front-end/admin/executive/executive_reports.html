<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Executive Reports — Command Center</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="css/executive.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" style="display:flex;flex-direction:column;overflow:hidden;">
      <header class="top-header">
        <div>
          <div class="page-title">Executive Reports</div>
          <div id="exec-page-subtitle" style="font-size:13px;color:var(--exec-muted);margin-top:4px;">Board-ready summaries across your organization</div>
        </div>
        <div class="exec-header-actions">
          <div id="executive-branch-switcher"></div>
        </div>
      </header>

      <div class="executive-content">
        <div id="context-banner" style="font-size:13px;color:var(--exec-muted);font-weight:500;margin-bottom:20px;"></div>

        <div class="exec-kpi-grid" id="report-kpis"></div>

        <div class="exec-two-col">
          <div class="exec-card">
            <div class="exec-card-header"><span class="exec-card-title">Branch Performance Summary</span></div>
            <div class="exec-table-wrap">
              <table class="exec-table">
                <thead>
                  <tr>
                    <th>Branch</th>
                    <th>Projects</th>
                    <th>Active Tasks</th>
                    <th>Violations</th>
                    <th>Health</th>
                  </tr>
                </thead>
                <tbody id="branch-summary-body"></tbody>
              </table>
            </div>
          </div>

          <div class="exec-card">
            <div class="exec-card-header"><span class="exec-card-title">Executive Snapshot</span></div>
            <div id="exec-snapshot" style="padding:20px 24px;font-size:14px;line-height:1.7;color:var(--exec-text);"></div>
          </div>
        </div>

        <div class="exec-card" style="margin-top:20px;">
          <div class="exec-card-header"><span class="exec-card-title">Quick Navigation</span></div>
          <div style="padding:20px 24px;display:flex;flex-wrap:wrap;gap:12px;">
            <a href="executive_dashboard.html" class="exec-pill blue" style="text-decoration:none;padding:10px 16px;"><i class="ri-dashboard-line"></i> Overview Dashboard</a>
            <a href="executive_projects.html" class="exec-pill blue" style="text-decoration:none;padding:10px 16px;"><i class="ri-folder-line"></i> Global Projects</a>
            <a href="executive_tasks.html" class="exec-pill blue" style="text-decoration:none;padding:10px 16px;"><i class="ri-list-check-2"></i> Global Tasks</a>
            <a href="executive_compliance.html" class="exec-pill blue" style="text-decoration:none;padding:10px 16px;"><i class="ri-shield-check-line"></i> Compliance</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/components/executive-branch-switcher.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="js/executive-shell.js"></script>
  <script src="executive_reports.js"></script>
</body>
</html>
