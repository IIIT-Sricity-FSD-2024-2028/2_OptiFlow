<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Global Tasks — Executive Command Center</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="css/executive.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" style="display:flex;flex-direction:column;overflow:hidden;">
      <header class="top-header">
        <div>
          <div class="page-title">Global Tasks</div>
          <div id="exec-page-subtitle" style="font-size:13px;color:var(--exec-muted);margin-top:4px;">All tasks across branches and teams</div>
        </div>
        <div class="exec-header-actions">
          <div id="executive-branch-switcher"></div>
        </div>
      </header>

      <div class="executive-content">
        <div class="exec-kpi-grid" id="task-kpis"></div>

        <div class="exec-toolbar">
          <div class="exec-toolbar-left">
            <div class="exec-search">
              <i class="ri-search-line"></i>
              <input type="text" id="task-search" placeholder="Search tasks, assignees, projects..." />
            </div>
            <select id="task-status-filter" class="exec-select">
              <option value="">All Statuses</option>
              <option value="In_Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="Draft">Draft</option>
              <option value="Blocked">Blocked</option>
            </select>
            <select id="task-priority-filter" class="exec-select">
              <option value="">All Priorities</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div id="context-banner" style="font-size:13px;color:var(--exec-muted);font-weight:500;"></div>
        </div>

        <div class="exec-card">
          <div class="exec-card-header">
            <span class="exec-card-title">Task Registry</span>
            <span id="task-count-label" style="font-size:12px;color:var(--exec-muted);"></span>
          </div>
          <div class="exec-table-wrap">
            <table class="exec-table">
              <thead>
                <tr>
                  <th>Task</th>
                  <th>Branch</th>
                  <th>Project</th>
                  <th>Assignee</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Due</th>
                </tr>
              </thead>
              <tbody id="tasks-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/components/executive-branch-switcher.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="js/executive-shell.js"></script>
  <script src="executive_tasks.js"></script>
</body>
</html>
