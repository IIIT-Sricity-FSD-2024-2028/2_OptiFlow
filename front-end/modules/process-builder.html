<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Workflow Builder — OfficeSync</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .builder-layout {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      height: calc(100vh - 120px);
    }
    .builder-sidebar {
      width: 320px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .builder-sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
      font-weight: 600;
    }
    .template-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }
    .template-item {
      padding: 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .template-item:hover, .template-item.active {
      background: #f8fafc;
      border-left: 3px solid var(--primary-color);
    }
    .template-name {
      font-weight: 600;
      color: var(--text-main);
      display: block;
    }
    .template-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin-top: 4px;
    }
    .builder-main {
      flex: 1;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .builder-main-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .steps-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }
    .step-item {
      background: white;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--primary-color);
    }
    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .step-name {
      font-weight: 600;
      color: var(--text-main);
    }
    .step-order {
      background: var(--bg-color);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .step-meta {
      font-size: 13px;
      color: var(--text-muted);
    }
    .add-step-form {
      padding: 20px;
      border-top: 1px solid var(--border-color);
      background: white;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-area">
      <header class="top-header">
        <h1 class="page-title">Workflow Builder</h1>
        <div class="header-actions">
          <div class="user-profile">
            <div class="avatar" id="sidebar-user-avatar">PA</div>
            <div class="user-info">
              <div class="name" id="sidebar-user-name">Loading...</div>
              <div class="role" id="sidebar-user-role">Process Admin</div>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content" id="main-content">
        <div id="errorMessage" style="display: none; background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 6px; margin-bottom: 20px;"></div>
        
        <div class="builder-layout">
          <!-- Left Panel: Templates -->
          <div class="builder-sidebar">
            <div class="builder-sidebar-header">Process Templates</div>
            <ul class="template-list" id="templateList">
              <li style="padding: 15px; color: var(--text-muted);">Loading templates...</li>
            </ul>
          </div>

          <!-- Right Panel: Steps Builder -->
          <div class="builder-main">
            <div class="builder-main-header">
              <h2 id="selectedTemplateTitle" style="margin: 0; font-size: 18px;">Select a Template</h2>
              <p id="selectedTemplateDesc" style="color: var(--text-muted); font-size: 13px; margin: 4px 0 0 0;"></p>
            </div>

            <div class="steps-container" id="stepsContainer">
              <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Select a template from the left panel to view and build its steps.</p>
            </div>

            <div class="add-step-form" id="addStepFormContainer" style="display: none;">
              <h3 style="margin: 0 0 15px 0; font-size: 16px;">Append New Step</h3>
              <form id="addStepForm">
                <div class="form-group" style="margin-bottom: 15px;">
                  <label class="form-label">Step Name</label>
                  <input type="text" id="stepName" class="form-control" required placeholder="e.g., HR Approval">
                </div>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                  <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label class="form-label">Step Type</label>
                    <select id="stepType" class="form-control" required>
                      <option value="Input_Required">Input Required</option>
                      <option value="Approval">Approval</option>
                      <option value="Automated_Task">Automated Task</option>
                    </select>
                  </div>
                  <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label class="form-label">Required Permission</label>
                    <select id="requiredPermissionId" class="form-control">
                      <option value="">-- None --</option>
                    </select>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Add Step</button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/utils/helpers.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="process-builder.js"></script>
</body>
</html>
