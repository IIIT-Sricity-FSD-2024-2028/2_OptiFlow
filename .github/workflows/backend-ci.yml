name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: optiflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'back-end-new/package-lock.json'

      - name: Install dependencies
        working-directory: back-end-new
        run: npm ci

      - name: Run CI Tests
        working-directory: back-end-new
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/optiflow_test?schema=public"
          JWT_SECRET: "ci_super_secret_jwt_key_at_least_32_characters_long"
          PLATFORM_JWT_EXPIRES_IN: "1h"
          PORT: 5599
        run: npm run test:ci
